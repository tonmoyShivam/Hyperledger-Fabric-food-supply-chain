# Food Supply Chain — Hyperledger Fabric 2.5.16 network
# Orgs: Farm, Processor, Distributor, Retail, Auditor + Orderer

version: "3.8"

networks:
  foodchain:
    name: foodchain

services:
  orderer.foodchain.com:
    container_name: orderer.foodchain.com
    image: hyperledger/fabric-orderer:2.5.16
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:8443
    working_dir: /root
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./organizations/ordererOrganizations/foodchain.com/orderers/orderer.foodchain.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/foodchain.com/orderers/orderer.foodchain.com/tls/:/var/hyperledger/orderer/tls
      - orderer.foodchain.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - foodchain

  couchdb.farm:
    container_name: couchdb.farm
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    networks:
      - foodchain

  peer0.farm.foodchain.com:
    container_name: peer0.farm.foodchain.com
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=foodchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.farm.foodchain.com
      - CORE_PEER_ADDRESS=peer0.farm.foodchain.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.farm.foodchain.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.farm.foodchain.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.farm.foodchain.com:7051
      - CORE_PEER_LOCALMSPID=FarmOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.farm:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0farm"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/farm.foodchain.com/peers/peer0.farm.foodchain.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/farm.foodchain.com/peers/peer0.farm.foodchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.farm.foodchain.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    depends_on:
      - couchdb.farm
      - orderer.foodchain.com
    ports:
      - "7051:7051"
    networks:
      - foodchain

  couchdb.processor:
    container_name: couchdb.processor
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "7984:5984"
    networks:
      - foodchain

  peer0.processor.foodchain.com:
    container_name: peer0.processor.foodchain.com
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=foodchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.processor.foodchain.com
      - CORE_PEER_ADDRESS=peer0.processor.foodchain.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.processor.foodchain.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.processor.foodchain.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.processor.foodchain.com:9051
      - CORE_PEER_LOCALMSPID=ProcessorOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.processor:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/processor.foodchain.com/peers/peer0.processor.foodchain.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/processor.foodchain.com/peers/peer0.processor.foodchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.processor.foodchain.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    depends_on:
      - couchdb.processor
      - orderer.foodchain.com
    ports:
      - "9051:9051"
    networks:
      - foodchain

  couchdb.distributor:
    container_name: couchdb.distributor
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "9984:5984"
    networks:
      - foodchain

  peer0.distributor.foodchain.com:
    container_name: peer0.distributor.foodchain.com
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=foodchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.distributor.foodchain.com
      - CORE_PEER_ADDRESS=peer0.distributor.foodchain.com:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.distributor.foodchain.com:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.distributor.foodchain.com:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.distributor.foodchain.com:11051
      - CORE_PEER_LOCALMSPID=DistributorOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.distributor:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/distributor.foodchain.com/peers/peer0.distributor.foodchain.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/distributor.foodchain.com/peers/peer0.distributor.foodchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.distributor.foodchain.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    depends_on:
      - couchdb.distributor
      - orderer.foodchain.com
    ports:
      - "11051:11051"
    networks:
      - foodchain

  couchdb.retail:
    container_name: couchdb.retail
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "11984:5984"
    networks:
      - foodchain

  peer0.retail.foodchain.com:
    container_name: peer0.retail.foodchain.com
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=foodchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.retail.foodchain.com
      - CORE_PEER_ADDRESS=peer0.retail.foodchain.com:13051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:13051
      - CORE_PEER_CHAINCODEADDRESS=peer0.retail.foodchain.com:13052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:13052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.retail.foodchain.com:13051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.retail.foodchain.com:13051
      - CORE_PEER_LOCALMSPID=RetailOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.retail:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/retail.foodchain.com/peers/peer0.retail.foodchain.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/retail.foodchain.com/peers/peer0.retail.foodchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.retail.foodchain.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    depends_on:
      - couchdb.retail
      - orderer.foodchain.com
    ports:
      - "13051:13051"
    networks:
      - foodchain

  couchdb.auditor:
    container_name: couchdb.auditor
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "13984:5984"
    networks:
      - foodchain

  peer0.auditor.foodchain.com:
    container_name: peer0.auditor.foodchain.com
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=foodchain
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.auditor.foodchain.com
      - CORE_PEER_ADDRESS=peer0.auditor.foodchain.com:15051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:15051
      - CORE_PEER_CHAINCODEADDRESS=peer0.auditor.foodchain.com:15052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:15052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.auditor.foodchain.com:15051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.auditor.foodchain.com:15051
      - CORE_PEER_LOCALMSPID=AuditorOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.auditor:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/auditor.foodchain.com/peers/peer0.auditor.foodchain.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/auditor.foodchain.com/peers/peer0.auditor.foodchain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.auditor.foodchain.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    depends_on:
      - couchdb.auditor
      - orderer.foodchain.com
    ports:
      - "15051:15051"
    networks:
      - foodchain

  cli:
    container_name: fabric-cli
    image: hyperledger/fabric-tools:2.5.16
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=fabric-cli
      - CORE_PEER_ADDRESS=peer0.farm.foodchain.com:7051
      - CORE_PEER_LOCALMSPID=FarmOrgMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/farm.foodchain.com/peers/peer0.farm.foodchain.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/farm.foodchain.com/peers/peer0.farm.foodchain.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/farm.foodchain.com/peers/peer0.farm.foodchain.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/farm.foodchain.com/users/Admin@farm.foodchain.com/msp
      - ORDERER_CA=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/ordererOrganizations/foodchain.com/orderers/orderer.foodchain.com/msp/tlscacerts/tlsca.foodchain.com-cert.pem
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ./scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
      - ../chaincode:/opt/gopath/src/github.com/chaincode
    depends_on:
      - peer0.farm.foodchain.com
      - peer0.processor.foodchain.com
      - peer0.distributor.foodchain.com
      - peer0.retail.foodchain.com
      - peer0.auditor.foodchain.com
      - orderer.foodchain.com
    networks:
      - foodchain

volumes:
  orderer.foodchain.com:
  peer0.farm.foodchain.com:
  peer0.processor.foodchain.com:
  peer0.distributor.foodchain.com:
  peer0.retail.foodchain.com:
  peer0.auditor.foodchain.com:
